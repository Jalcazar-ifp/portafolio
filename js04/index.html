<body>
    <script type="text/javascript" language="javascript">
        var verd="verd";
        var red="vermell";
                var respuesta=prompt("choose color");
        if (respuesta == red)
        {
            document.body.style.backgroundColor="#C3110C";
            document.write ("vermell");
            document.body.style.color="#fff";

        if (respuesta == verd)

            document.write ("verd");
            document.body.style.color="#fff";
        }

    </script>
